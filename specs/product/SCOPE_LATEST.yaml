core_value: >
  Prove, on every push, that big-release and bigbase-deploy still work together —
  a minimal PHP site that exists to be a regression signal, not a product — and
  specifically prove app_type: php end-to-end since it has never been exercised
  through the real CI/deploy pipeline before.

summary: >
  bigbase-canary-php is the PHP member of a four-language canary fleet
  (go/python/node/php). Unlike the other three, no upstream CI template exists
  for PHP in danielvm-git/.github — this repo authors test-build-release.yml and
  deploy.yml from scratch, mirroring the Python pair's job shape with
  Composer/PHPUnit in place of uv/pytest. Once proven green, those templates get
  promoted into .github's shared workflow-templates as the fifth official pair.
  bigbase's deploy engine already fully implements app_type: php
  (components/deploy/deploy.go, engine.go) — what's missing is purely the CI
  template and the action/contract doc's mention of it, both fixed here and in
  the shared .github repo.

in_scope:
  - item: Minimal PHP app (index.php, no framework) reading VERSION into an HTML footer
    maps_to: e01s01
  - item: .big-release.yml (tagFormat v${version}, plugins changelog/git/github)
    maps_to: e01s01
  - item: test-build-release-php.yml + deploy-php.yml authored from scratch, mirroring Python's job shape
    maps_to: e01s01
  - item: bigbase site provisioning (site "php" -> php.bigbase.click) and GitHub secrets
    maps_to: e01s01
  - item: Promoting the proven-green templates into danielvm-git/.github (tracked as a separate shared-resource task)
    maps_to: e01s01

out_of_scope:
  - item: Any real product feature (auth, persistence, multi-page routing)
    reason: not valuable — this repo's value is being small and stable
  - item: Non-PHP implementations
    reason: covered by sibling repos bigbase-canary-go/python/node
  - item: Fixing a deploy-host PHP/Composer tooling gap, if hit
    reason: that's a bigbase-repo bug investigation, tracked separately, not in scope for this app repo

constraints:
  tech: "PHP 8.3+, Composer, GitHub Actions (ubuntu-22.04), bigbase.click as the only deploy target"
  time: "single-session build"
  resource: "solo developer (danielvm-git), solo-git integrate profile"

success_criteria:
  - A push to main produces a green Test Build Release run and a green Deploy run
  - "curl https://php.bigbase.click returns the current VERSION file's contents in the footer (body content verified, not just HTTP status)"
  - A second commit produces a second tag via big-release and a fresh deploy
  - The proven CI templates are promoted into danielvm-git/.github

references:
