core_value: "Adapt bigbase-canary-php to consume centralized reusable CI/CD workflows from danielvm-git/.github with big-release enabled."
summary: |
  Following Discussion #32 (v4.1.0 update), danielvm-git/.github now supports reusable workflow
  invocation with configurable parameters, including release_tool ("big-release" vs "semantic-release").
  This initiative updates bigbase-canary-php's CI/CD pipeline configuration to invoke the centralized
  reusable workflows from danielvm-git/.github instead of using standalone local workflows.

in_scope:
  - "Replace local standalone workflow definitions with reusable workflow calls to danielvm-git/.github"
  - "Configure release_tool: 'big-release' in CI pipeline inputs"
  - "Configure site_url: 'https://php.bigbase.click' in CI pipeline inputs"
  - "Verify preflight, lint, test, and deploy-meta boundary artifact compatibility"

out_of_scope:
  - "Modifying application code (index.php, tests/)"
  - "Modifying centralized workflows inside danielvm-git/.github"

constraints:
  - "Must preserve big-release execution for canary regression testing"
  - "No direct commits to main; use kickoff-branch workflow for implementation"

success_criteria:
  - "CI/CD workflow file in .github/workflows/ invokes danielvm-git/.github/.github/workflows/test-build-release-php.yml@main"
  - "Input release_tool is explicitly set to 'big-release'"
  - "Input site_url is explicitly set to 'https://php.bigbase.click'"
  - "Preflight lint and test suites exit 0"

references:
  - "https://github.com/danielvm-git/.github/discussions/32"
